name: Supabase health check

on:
  schedule:
    # Gaps of 2, 2 and 3 days; avoids month-boundary surprises from */3.
    - cron: '17 4 * * 1,3,5'
      timezone: America/Santiago
  workflow_dispatch:

# No checkout, source changes, deployment or privileged database credentials.
permissions: {}

concurrency:
  group: supabase-health
  cancel-in-progress: false

jobs:
  read-public-row:
    name: Read one public database identifier
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Supabase Data API
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          : "${SUPABASE_URL:?Set the SUPABASE_URL repository variable}"
          : "${SUPABASE_PUBLISHABLE_KEY:?Set the SUPABASE_PUBLISHABLE_KEY repository variable}"

          # Refuse an elevated key even if the variable is accidentally misconfigured.
          if [[ "$SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* ]]; then
            echo '::error::Only a Supabase publishable key is allowed.'
            exit 1
          fi

          response="$(curl --fail --silent --show-error \
            --proto '=https' \
            --connect-timeout 10 --max-time 20 \
            --retry 2 --retry-delay 5 --retry-max-time 65 \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header 'Accept: application/json' \
            --header 'Cache-Control: no-cache' \
            --get \
            --data-urlencode 'select=id' \
            --data-urlencode 'id=eq.main' \
            --data-urlencode 'limit=1' \
            "${SUPABASE_URL%/}/rest/v1/site_content")"

          # Also fail if an HTTP 200 hides an empty result or a changed RLS policy.
          jq -e 'type == "array" and length == 1 and .[0].id == "main"' \
            <<< "$response" > /dev/null

          echo 'Supabase answered successfully: one public identifier read.'
          printf '### Supabase health check\n\nOne public identifier read successfully at %s. No data changed.\n' \
            "$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"

  keep-schedule-active:
    name: Renew scheduled workflow activity
    if: github.repository == 'gprecabarren/hostal-piffre'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Only this isolated job can refresh workflow metadata. It receives no DB key.
    permissions:
      actions: write
    steps:
      - name: Refresh this workflow without creating commits
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow_path="repos/${GITHUB_REPOSITORY}/actions/workflows/supabase-health.yml"
          gh api --method PUT "$workflow_path/enable" --silent
          state="$(gh api "$workflow_path" --jq '.state')"
          if [[ "$state" != active ]]; then
            echo '::error::The scheduled workflow is not active.'
            exit 1
          fi
          echo 'Scheduled workflow renewed successfully; no commits or deployments created.'
          printf '### Scheduled workflow renewal\n\nGitHub accepted the renewal and reports the workflow as active. No source files changed.\n' \
            >> "$GITHUB_STEP_SUMMARY"
